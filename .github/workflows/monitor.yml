name: Synthetic uptime monitor

# Runs synthetic checks on live site + backend (home, practice, coding, etc.)
# and emails an alert if any endpoint is down or slow.
#
# No secrets required unless monitor.mjs has custom email setup.
# Grep monitor.mjs to verify: grep -E 'process.env' scripts/monitor.mjs

on:
  schedule:
    # Every 6 hours, not daily. robots.txt going unfetchable stops Googlebot
    # crawling the entire site; on 16-17 Aug 2026 that ran for two full days
    # before anything noticed, and cost ~40 positions. Four checks a day bounds
    # the blind window to six hours.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}      # allow manual runs from the Actions tab

permissions:
  contents: read            # read-only, no modifications

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install --no-audit --no-fund

      # The scheduled run is the only thing that looks at production between
      # deploys. --live adds the checks that need real HTTP: robots.txt status
      # and content type, sitemap URLs returning 200, and X-Robots-Tag. It needs
      # a build first because the offline half reads dist/.
      - name: Build (traffic-health reads dist/)
        run: npm run build
        env:
          CI: 'true'

      - name: Traffic health (live)
        run: node scripts/traffic-health.mjs --live

      - name: Run uptime checks
        # These were commented out, so a failing check could only ever print to
        # a log nobody reads. monitor.mjs already no-ops gracefully when the key
        # is absent, so wiring them costs nothing if the secret is unset.
        env:
          ALERT_EMAIL: narasatish966@gmail.com
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/monitor.mjs
