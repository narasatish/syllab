<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page Not Found | Syllab</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    main {
      width: min(90vw, 560px);
      padding: 40px;
      border-radius: 28px;
      background: #ffffff;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    p:first-child {
      margin: 0 0 12px;
      color: #10b981;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 52px);
      line-height: 1;
    }
    p {
      color: #64748b;
      font-weight: 650;
      line-height: 1.65;
    }
    a {
      display: inline-block;
      margin-top: 18px;
      border-radius: 18px;
      background: #10b981;
      padding: 14px 22px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <p>404</p>
    <h1>Page not found</h1>
    <p>The Syllab page you requested does not exist.</p>
    <a href="/">Go Home</a>
  </main>
</body>
</html>
