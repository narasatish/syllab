<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#134e4a"/>
      <stop offset="100%" style="stop-color:#0c4a6e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="105" x2="1200" y2="105" stroke="white" stroke-width="1"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="white" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="white" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="white" stroke-width="1"/>
    <line x1="0" y1="525" x2="1200" y2="525" stroke="white" stroke-width="1"/>
    <line x1="150" y1="0" x2="150" y2="630" stroke="white" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="white" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="630" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="1"/>
    <line x1="750" y1="0" x2="750" y2="630" stroke="white" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="white" stroke-width="1"/>
    <line x1="1050" y1="0" x2="1050" y2="630" stroke="white" stroke-width="1"/>
  </g>

  <!-- Glow circle top-right -->
  <circle cx="1050" cy="120" r="200" fill="#10b981" opacity="0.07"/>
  <!-- Glow circle bottom-left -->
  <circle cx="150" cy="510" r="180" fill="#0ea5e9" opacity="0.07"/>

  <!-- Logo circle -->
  <circle cx="120" cy="110" r="52" fill="url(#accent)" filter="url(#glow)"/>
  <text x="120" y="124" font-family="Arial Black, sans-serif" font-size="44" font-weight="900" fill="white" text-anchor="middle">S</text>

  <!-- Brand name -->
  <text x="195" y="125" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="white" letter-spacing="-1">Syllab.in</text>

  <!-- Accent line -->
  <rect x="80" y="175" width="520" height="4" fill="url(#accent)" rx="2"/>

  <!-- Main headline -->
  <text x="80" y="265" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="white" letter-spacing="-1">Free AI Learning for</text>
  <text x="80" y="335" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="white" letter-spacing="-1">Indian Students</text>

  <!-- Sub headline -->
  <text x="80" y="400" font-family="Arial, sans-serif" font-size="28" fill="#94a3b8" letter-spacing="0">CBSE · NCERT · JEE · NEET · EAMCET · Class 1–12</text>

  <!-- Feature pills -->
  <rect x="80" y="448" width="175" height="44" rx="22" fill="#10b981" opacity="0.2"/>
  <text x="167" y="475" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#6ee7b7" text-anchor="middle">AI Tutor</text>

  <rect x="270" y="448" width="200" height="44" rx="22" fill="#0ea5e9" opacity="0.2"/>
  <text x="370" y="475" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#7dd3fc" text-anchor="middle">Mock Tests</text>

  <rect x="486" y="448" width="215" height="44" rx="22" fill="#a855f7" opacity="0.2"/>
  <text x="593" y="475" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#d8b4fe" text-anchor="middle">Daily Challenges</text>

  <rect x="718" y="448" width="185" height="44" rx="22" fill="#f59e0b" opacity="0.2"/>
  <text x="810" y="475" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#fcd34d" text-anchor="middle">Formula Bank</text>

  <!-- Bottom tagline -->
  <text x="80" y="560" font-family="Arial, sans-serif" font-size="22" fill="#64748b">Completely free · No subscription · Works offline as a PWA</text>

  <!-- Right side decoration — stacked cards -->
  <g transform="translate(940, 240)" opacity="0.85">
    <rect x="20" y="20" width="200" height="120" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="10" y="10" width="200" height="120" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="120" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="20" y="38" font-family="Arial, sans-serif" font-size="11" fill="#10b981" font-weight="700" letter-spacing="2">CLASS 10 · SCIENCE</text>
    <text x="20" y="66" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="white">Life Processes</text>
    <text x="20" y="88" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">42 practice questions</text>
    <rect x="20" y="98" width="80" height="8" rx="4" fill="url(#accent)" opacity="0.8"/>
  </g>
</svg>
